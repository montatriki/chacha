# /etc/nginx/sites-available/levelupbusiness.site
# Reverse proxy for the Level Up Com site (PM2 app "levelup-com" on port 3002).
# Certbot adds the HTTPS server block and the redirect when you run it (see deploy/README.md).
server {
    listen 80;
    listen [::]:80;
    server_name levelupbusiness.site www.levelupbusiness.site;

    client_max_body_size 100M;

    # Videos and other static assets. Proxied to Next.js (which supports range requests) rather
    # than read from disk: the app lives under /root, which nginx's www-data user cannot enter.
    location /data/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_buffering off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
